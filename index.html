<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RangoraPlay - Bengali Short Dramas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Arial,'Noto Sans Bengali',sans-serif;background:#0f0f0f;color:#fff;padding-bottom:75px;}
  /* Header */
  .header{display:flex;align-items:center;justify-content:space-between;padding:15px;background:#0a0a0a;border-bottom:2px solid #e50914;}
  .logo{font-size:26px;font-weight:800;color:#e50914;letter-spacing:.5px;}
  .logo span{color:#fff;}
  .langs{display:flex;gap:8px;}
  .lang-btn{padding:6px 14px;border-radius:20px;background:#222;color:#ccc;border:1px solid #444;font-size:14px;cursor:pointer;}
  .lang-btn.active{background:#e50914;color:#fff;border-color:#e50914;}
  /* Hero */
  .hero{position:relative;text-align:center;padding:35px 15px;background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.95)), url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b6?auto=format&fit=crop&w=800&q=80') center/cover;margin-bottom:15px;}
  .hero h1{font-size:30px;font-weight:800;margin-bottom:10px;text-shadow:0 2px 4px #000;}
  .hero p{font-size:15px;color:#ddd;margin-bottom:20px;}
  .hero-btn{display:inline-block;background:#e50914;color:#fff;padding:14px 40px;border-radius:30px;font-size:17px;font-weight:700;text-decoration:none;box-shadow:0 4px 15px rgba(229,9,20,.4);}
  /* Cats */
  .cats{display:flex;gap:10px;padding:0 15px 15px;overflow-x:auto;}
  .cat-btn{padding:8px 18px;border-radius:20px;background:#222;color:#ccc;border:1px solid #444;font-size:14px;white-space:nowrap;cursor:pointer;}
  .cat-btn.active{background:#e50914;color:#fff;border-color:#e50914;}
  /* Grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px;}
  .card{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:#222;cursor:pointer;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.92));padding:40px 10px 10px;}
  .card-title{font-size:15px;font-weight:700;margin-bottom:3px;}
  .card-meta{font-size:12px;color:#e50914;}
  .badge{position:absolute;top:8px;right:8px;background:#e50914;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
  /* Sticky */
  .sticky{position:fixed;bottom:0;left:0;right:0;background:#1a0505;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid #e50914;z-index:99;}
  .sticky-text{font-size:15px;font-weight:600;}
  .sticky-btn{background:#e50914;color:#fff;padding:10px 24px;border-radius:25px;font-weight:700;text-decoration:none;font-size:15px;}
  /* Toast */
  .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);color:#fff;padding:16px 26px;border-radius:10px;display:none;z-index:999;border:1px solid #e50914;text-align:center;font-size:14px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Rangora<span>Play</span></div>
  <div class="langs">
    <button class="lang-btn active" onclick="setLang('bn',this)">বাংলা</button>
    <button class="lang-btn" onclick="setLang('hi',this)">हिंदी</button>
    <button class="lang-btn" onclick="setLang('en',this)">English</button>
  </div>
</div>

<div class="hero">
  <h1 id="heroTitle">বাংলা শর্ট ড্রামা</h1>
  <p id="heroSub">প্রেম, ড্রামা, থ্রিলার - সব এক অ্যাপে</p>
  <a href="#" class="hero-btn" onclick="triggerDownload();return false;" id="heroBtn">ডাউনলোড করুন</a>
</div>

<div class="cats">
  <button class="cat-btn active" id="catAll" onclick="filterCat('all',this)">সব</button>
  <button class="cat-btn" id="catRomance" onclick="filterCat('romance',this)">রোমান্স</button>
  <button class="cat-btn" id="catDrama" onclick="filterCat('drama',this)">ড্রামা</button>
  <button class="cat-btn" id="catThriller" onclick="filterCat('thriller',this)">থ্রিলার</button>
  <button class="cat-btn" id="catAction" onclick="filterCat('action',this)">অ্যাকশন</button>
</div>

<div class="grid" id="grid"></div>

<div class="sticky">
  <div class="sticky-text" id="stickyText">Rangora Play - ফ্রি ডাউনলোড</div>
  <a href="#" class="sticky-btn" onclick="triggerDownload();return false;" id="stickyBtn">ডাউনলোড</a>
</div>

<div class="toast" id="toast"></div>

<script>
const APK_URL = "https://kepj273g1ker.xalvioncraft.com/Upcc1RsKbcDc";

const IMG = {
  i1:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b6?auto=format&fit=crop&w=600&q=80",
  i2:"https://images.unsplash.com/photo-1518894781321-630e638d0742?auto=format&fit=crop&w=600&q=80",
  i3:"https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=600&q=80",
  i4:"https://images.unsplash.com/photo-1532453288672-3a27e9be9efd?auto=format&fit=crop&w=600&q=80",
  i5:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80",
  i6:"https://images.unsplash.com/photo-1488972685288-c3fd157d7c7a?auto=format&fit=crop&w=600&q=80"
};

const dramas = [
  {title:{bn:"হৃদয়ের কথা",hi:"दिल की बात",en:"Heart's Tale"}, cat:"romance", img:IMG.i1, badge:"New"},
  {title:{bn:"প্রেমের ফাঁদ",hi:"प्यार का जाल",en:"Love Trap"}, cat:"romance", img:IMG.i2, badge:"Hot"},
  {title:{bn:"রাতের প্রেম",hi:"रात का प्यार",en:"Midnight Love"}, cat:"romance", img:IMG.i3, badge:"New"},
  {title:{bn:"বিরহের বাঁশি",hi:"विरह की बांसुरी",en:"Separation Flute"}, cat:"drama", img:IMG.i4},
  {title:{bn:"ভালোবাসার শপথ",hi:"प्यार की कसम",en:"Love Oath"}, cat:"romance", img:IMG.i5, badge:"18+"},
  {title:{bn:"ছায়া সন্দেহ",hi:"छाया संदेह",en:"Shadow Doubt"}, cat:"thriller", img:IMG.i6},
  {title:{bn:"অন্তরের আগুন",hi:"अंतर की आग",en:"Inner Fire"}, cat:"drama", img:IMG.i1},
  {title:{bn:"দুরন্ত প্রেম",hi:"दुर्दांत प्यार",en:"Wild Love"}, cat:"action", img:IMG.i2, badge:"Hot"},
  {title:{bn:"রহস্য রাত",hi:"रहस्यमयी रात",en:"Mystery Night"}, cat:"thriller", img:IMG.i3, badge:"18+"},
  {title:{bn:"শেষ বিদায়",hi:"अंतिम विदाई",en:"Final Goodbye"}, cat:"drama", img:IMG.i4}
];

const i18n = {
  bn:{heroTitle:"বাংলা শর্ট ড্রামা", heroSub:"প্রেম, ড্রামা, থ্রিলার - সব এক অ্যাপে", heroBtn:"ডাউনলোড করুন", stickyText:"Rangora Play - ফ্রি ডাউনলোড", stickyBtn:"ডাউনলোড", toast:"ডাউনলোড শুরু হচ্ছে...<br>অপেক্ষা করুন", catAll:"সব", catRomance:"রোমান্স", catDrama:"ড্রামা", catThriller:"থ্রিলার", catAction:"অ্যাকশন"},
  hi:{heroTitle:"बंगाली शॉर्ट ड्रामा", heroSub:"रोमांस, ड्रामा, थ्रिलर - एक ऐप में", heroBtn:"डाउनलोड करें", stickyText:"Rangora Play - फ्री डाउनलोड", stickyBtn:"डाउनलोड", toast:"डाउनलोड शुरू...<br>इंतजार करें", catAll:"सभी", catRomance:"रोमांस", catDrama:"ड्रामा", catThriller:"थ्रिलर", catAction:"एक्शन"},
  en:{heroTitle:"Bengali Short Dramas", heroSub:"Romance, Drama, Thriller - All in One", heroBtn:"Download Now", stickyText:"Rangora Play - Free Download", stickyBtn:"Download", toast:"Download starting...<br>Please wait", catAll:"All", catRomance:"Romance", catDrama:"Drama", catThriller:"Thriller", catAction:"Action"}
};

let currentLang='bn', currentCat='all';

function setLang(l, btn) {
  currentLang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const t=i18n[l];
  document.getElementById('heroTitle').textContent=t.heroTitle;
  document.getElementById('heroSub').textContent=t.heroSub;
  document.getElementById('heroBtn').textContent=t.heroBtn;
  document.getElementById('stickyText').textContent=t.stickyText;
  document.getElementById('stickyBtn').textContent=t.stickyBtn;
  document.getElementById('catAll').textContent=t.catAll;
  document.getElementById('catRomance').textContent=t.catRomance;
  document.getElementById('catDrama').textContent=t.catDrama;
  document.getElementById('catThriller').textContent=t.catThriller;
  document.getElementById('catAction').textContent=t.catAction;
  renderGrid();
}

function renderGrid() {
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  dramas.filter(d=>currentCat==='all'||d.cat===currentCat).forEach(d=>{
    const card=document.createElement('div');
    card.className='card';
    card.onclick=()=>triggerDownload();
    const catName=i18n[currentLang]['cat'+d.cat.charAt(0).toUpperCase()+d.cat.slice(1)];
    card.innerHTML=`<img src="${d.img}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#222;color:#fff;font-size:18px;text-align:center;padding:10px;">${d.title[currentLang]}</div><div class="overlay"><div class="card-title">${d.title[currentLang]}</div><div class="card-meta">${catName}</div></div>${d.badge?`<div class="badge">${d.badge}</div>`:''}`;
    grid.appendChild(card);
  });
}

function filterCat(cat, btn) {
  currentCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function triggerDownload() {
  const toast=document.getElementById('toast');
  toast.innerHTML=i18n[currentLang].toast;
  toast.style.display='block';
  setTimeout(()=>{toast.style.display='none';},3000);
  const a=document.createElement('a');
  a.href=APK_URL;
  a.download='RangoraPlay.apk';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

renderGrid();
</script>
</body>
</html>
